# Gemini 4 Argon on antigravity-cli (high is its top effort), with the leaderboard settings. Keys in .env: GEMINI_API_KEY (GOOGLE_GEMINI_BASE_URL for a proxy).
# The agent runs under a network allowlist: through a proxy, put the proxy's hostname below.
#   ./run.sh configs/gemini-4-argon.yaml
n_attempts: 3
n_concurrent_trials: 24

# Only infrastructure failures are retried; the exceptions below (an agent timeout among
# them) are real outcomes and are graded as they ran.
retry:
  max_retries: 3
  wait_multiplier: 2.0
  min_wait_sec: 1.0
  max_wait_sec: 60.0
  exclude_exceptions:
    - AgentSafetyRefusalError
    - AgentAuthenticationError
    - ModelNotFoundError
    - ApiUsageLimitError
    - OutputTokenExceededError
    - ContextWindowExceededError
    - OutputLengthExceededError
    - ContextLengthExceededError
    - VerifierOutputParseError
    - RewardFileEmptyError
    - AgentTimeoutError

environment:
  type: modal

agents:
  - name: antigravity-cli
    model_name: gemini/gemini-4-argon
    extra_allowed_hosts:
      - generativelanguage.googleapis.com
    kwargs:
      reasoning_effort: high

datasets:
  - path: data
